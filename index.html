<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="snake-192.png">
<link rel="apple-touch-icon" href="snake-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    /* ---- elevation ladder: depth by lightness, not shadow ---- */
    --bg:#000000;
    --s1:#111311;            /* cards */
    --s2:#191c18;            /* nested panels */
    --s3:#22261f;            /* sheets, intake, top layer */
    --field:#0b0d0b;
    /* ---- text emphasis ---- */
    --hi:rgba(240,245,238,.94);
    --mid:rgba(240,245,238,.74);
    --dim:rgba(240,245,238,.58);
    --faint:rgba(240,245,238,.34);   /* decoration only, never text */
    /* ---- accent + semantics ---- */
    --sage:#a8c3a0;
    --sage-hi:#bcd6b4;
    --sage-mute:rgba(168,195,160,.55);
    --amber:#e0b15a;
    --tint:rgba(168,195,160,.09);
    --tint-strong:rgba(168,195,160,.15);
    --tint-line:rgba(168,195,160,.30);
    --grey:#8E9192;
    --line:rgba(240,245,238,.10);
    --line-soft:rgba(240,245,238,.055);
    --track:rgba(240,245,238,.09);
    /* ---- shape + rhythm ---- */
    --r-sm:10px; --r-md:16px; --r-lg:22px;
    --ease:cubic-bezier(.34,1.4,.64,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg);}
  body{
    color:var(--hi);
    font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.45;
    -webkit-text-size-adjust:100%; padding:0 0 44px;
  }
  .wrap{max-width:520px; margin:0 auto; padding:14px 16px 0;}
  h1,h2,h3,.cond{font-family:'Barlow Condensed','Barlow',sans-serif; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; margin:0;}
  button,input{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--sage); outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}

  header{padding-top:10px;}
  .eyebrow{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:12.5px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--dim);}
  h1{font-size:32px; line-height:1; margin:3px 0 14px; color:var(--hi); letter-spacing:.03em;}
  h1 .mo-yr{color:var(--sage);}

  /* ---------- tab bar ---------- */
  .tabs{position:relative; display:flex; gap:0; margin:0 0 16px;
    background:var(--s1); border:1px solid var(--line-soft); border-radius:14px; padding:4px;}
  .tabind{position:absolute; top:4px; left:4px; height:calc(100% - 8px); border-radius:11px;
    background:var(--tint-strong); border:1px solid var(--tint-line);
    transition:transform .28s var(--ease), width .28s var(--ease); pointer-events:none;}
  .tabs button{position:relative; flex:1 1 0; display:flex; flex-direction:column; align-items:center;
    gap:3px; padding:8px 2px 7px; background:transparent; border:none; color:var(--dim);
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px;
    text-transform:uppercase; letter-spacing:.09em; transition:color .2s ease;}
  .tabs button svg{width:19px; height:19px; stroke:currentColor; fill:none;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .tabs button[aria-selected="true"]{color:var(--sage);}

  /* ---------- cards ---------- */
  .card{background:var(--s1); color:var(--hi); border:1px solid var(--line-soft);
    border-radius:var(--r-md); padding:18px; margin:0 0 12px;}
  .card h2{font-size:15px; color:var(--mid); margin-bottom:12px; letter-spacing:.12em;}
  .card .sub{font-size:12.5px; color:var(--dim); margin:-8px 0 14px; line-height:1.5;}

  /* ---------- today ---------- */
  .daystrip{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .daystrip button{width:44px; height:44px; flex:none; border-radius:var(--r-sm);
    background:var(--s1); border:1px solid var(--line-soft); color:var(--mid);
    font-size:19px; line-height:1;}
  .daystrip button[disabled]{opacity:.25; cursor:default;}
  .daystrip .dlabel{flex:1; text-align:center;}
  .daystrip .dlabel .d1{font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:23px; text-transform:uppercase; letter-spacing:.05em; color:var(--hi);}
  .daystrip .dlabel .d2{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--sage); min-height:16px; font-weight:600;}

  .act{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    background:var(--s1); border:1px solid var(--line-soft); border-left:3px solid transparent;
    border-radius:var(--r-md); padding:14px 16px; margin-bottom:9px; color:var(--hi);
    transition:background .18s ease, border-color .18s ease;}
  .act.on{background:var(--s2); border-left-color:var(--sage);}
  .act .ring{width:30px; height:30px; flex:none;}
  .act .ring circle{fill:none; stroke-width:2.5;}
  .act .ring .bgc{stroke:rgba(240,245,238,.16);}
  .act .ring .fgc{stroke:var(--sage); stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset .5s var(--ease);}
  .act .ring .chk{stroke:var(--sage); stroke-width:2.4; stroke-linecap:round;
    stroke-linejoin:round; fill:none; opacity:0; transition:opacity .2s ease .12s;}
  .act.on .ring .chk{opacity:1;}
  .act .name{display:block; font-weight:600; font-size:15px; line-height:1.3; color:var(--hi);}
  .act.on .name{color:var(--sage);}
  .act .sup{display:block; font-size:11.5px; color:var(--dim); margin-top:2px; letter-spacing:.02em;}
  .act .meta{text-align:right; white-space:nowrap; font-family:'Barlow Condensed',sans-serif;
    letter-spacing:.03em; line-height:1;}
  .act .meta .n{font-size:21px; font-weight:700; color:var(--hi);}
  .act .meta .d{font-size:13px; color:var(--dim);}
  .act .col{flex:1; min-width:0;}
  .daytally{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; font-size:13px; color:var(--dim); text-align:center;
    padding:6px 0 16px;}
  .daytally b{color:var(--sage); font-size:15px;}

  /* ---------- hero ring ---------- */
  .hero{display:flex; align-items:center; gap:18px; background:var(--s1);
    border:1px solid var(--line-soft); border-radius:var(--r-lg); padding:18px;
    margin:0 0 12px; box-shadow:0 0 0 1px rgba(168,195,160,.05), 0 10px 34px rgba(168,195,160,.05);}
  .hero .ringwrap{position:relative; width:132px; height:132px; flex:none;}
  .hero svg{width:132px; height:132px; transform:rotate(-90deg);}
  .hero svg circle{fill:none; stroke-width:9; stroke-linecap:round;}
  .hero svg .bgc{stroke:var(--track);}
  .hero svg .fgc{stroke:var(--sage); transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.3,1);}
  .hero .inner{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;}
  .hero .pct{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:46px;
    line-height:.9; color:var(--sage); letter-spacing:.01em;}
  .hero .pct sup{font-size:19px; vertical-align:top; margin-left:1px; top:.35em; position:relative;}
  .hero .cap{font-family:'Barlow Condensed',sans-serif; font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--dim); margin-top:2px;}
  .hero .side{flex:1; min-width:0; display:flex; flex-direction:column; gap:11px;}
  .hero .side .row .k{font-family:'Barlow Condensed',sans-serif; font-size:10.5px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--dim);}
  .hero .side .row .v{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px;
    color:var(--hi); line-height:1.05; letter-spacing:.02em;}

  /* ---------- calendar ---------- */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal .dow{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:10.5px;
    letter-spacing:.1em; text-align:center; color:var(--dim); padding-bottom:3px;}
  .cal button{aspect-ratio:1/1; border-radius:var(--r-sm); border:1px solid transparent;
    background:var(--s2); color:var(--dim); font-size:11.5px; font-weight:600; padding:0;
    font-variant-numeric:tabular-nums; transition:transform .15s var(--ease);}
  .cal button:active{transform:scale(.9);}
  .cal button.l1{background:rgba(168,195,160,.22); color:var(--mid);}
  .cal button.l2{background:rgba(168,195,160,.42); color:var(--hi);}
  .cal button.l3{background:rgba(168,195,160,.68); color:#0a0f09;}
  .cal button.l4{background:var(--sage); color:#0a0f09;}
  .cal button[disabled]{opacity:.3; cursor:default; background:var(--s2);}
  .cal button.today{box-shadow:0 0 0 2px var(--sage-hi);}
  .cal .pad{aspect-ratio:1/1;}
  .callegend{display:flex; align-items:center; justify-content:flex-end; gap:5px;
    margin-top:11px; font-family:'Barlow Condensed',sans-serif; font-size:10.5px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--dim);}
  .callegend i{width:11px; height:11px; border-radius:3px; display:block;}

  /* ---------- progress rows ---------- */
  .prog{display:flex; flex-direction:column; gap:14px;}
  .prog .row .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-size:13.5px; font-weight:600; margin-bottom:6px; color:var(--mid);}
  .prog .row .top .rt{font-family:'Barlow Condensed',sans-serif; letter-spacing:.03em;
    font-variant-numeric:tabular-nums;}
  .prog .row .top .rt b{font-size:16px; color:var(--hi); font-weight:700;}
  .prog .row .top .rt span{font-size:13px; color:var(--dim);}
  .prog .bar{height:7px; border-radius:4px; background:var(--track); overflow:hidden;}
  .prog .bar i{display:block; height:100%; border-radius:4px; background:var(--sage-mute);
    transition:width .6s var(--ease);}
  .prog .bar.full i{background:linear-gradient(90deg,var(--sage),var(--sage-hi));}

  /* ---------- forms ---------- */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .fld label{display:block; font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim);
    margin-bottom:4px;}
  .fld input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--field); color:var(--hi); font-size:16px; font-weight:600;
    font-variant-numeric:tabular-nums; transition:border-color .18s ease;}
  .fld input:focus{border-color:var(--sage); outline:none;}
  .btn{display:block; width:100%; padding:13px; border-radius:var(--r-sm); border:1px solid var(--sage);
    background:var(--sage); color:#0a0f09; font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:16px; letter-spacing:.09em; text-transform:uppercase;
    transition:transform .12s var(--ease), opacity .15s ease;}
  .btn:active{transform:scale(.985);}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--mid);}
  .btn.warn{background:transparent; border:1px solid var(--line); color:var(--grey);}
  .btn+.btn{margin-top:9px;}
  .btn[disabled]{opacity:.35; cursor:default;}
  .derived{margin-top:12px; border-radius:var(--r-sm); background:var(--field); padding:2px 12px;}
  .derived .d{display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; font-size:12.5px; color:var(--mid); border-top:1px solid var(--line-soft);}
  .derived .d:first-child{border-top:none;}
  .derived b{font-family:'Barlow Condensed',sans-serif; font-size:21px; color:var(--sage);
    letter-spacing:.02em; font-variant-numeric:tabular-nums;}
  .derived .ref{font-size:10.5px; color:var(--dim); display:block; margin-top:1px;}
  .flag{margin-top:12px; padding:10px 12px; border-radius:var(--r-sm); background:rgba(224,177,90,.10);
    border:1px solid rgba(224,177,90,.32); color:#e8c584; font-size:12.5px;}

  /* ---------- three-day intake ---------- */
  .stepper{display:flex; align-items:center; gap:0; margin:0 0 16px;}
  .stepper .st{flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative;}
  .stepper .st::before{content:""; position:absolute; top:9px; left:-50%; width:100%; height:2px;
    background:var(--track);}
  .stepper .st:first-child::before{display:none;}
  .stepper .st.done::before,.stepper .st.now::before{background:var(--sage-mute);}
  .stepper .dot{width:20px; height:20px; border-radius:50%; background:var(--s2);
    border:2px solid var(--line); position:relative; z-index:1;
    transition:background .25s var(--ease), border-color .25s var(--ease);}
  .stepper .st.done .dot{background:var(--sage); border-color:var(--sage);}
  .stepper .st.done .dot::after{content:""; position:absolute; left:5px; top:1px; width:4px; height:9px;
    border:solid #0a0f09; border-width:0 2px 2px 0; transform:rotate(42deg);}
  .stepper .st.now .dot{border-color:var(--sage); box-shadow:0 0 0 4px rgba(168,195,160,.14);}
  .stepper .lb{font-family:'Barlow Condensed',sans-serif; font-size:10.5px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--dim);}
  .stepper .st.done .lb,.stepper .st.now .lb{color:var(--sage);}

  .slabel{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:9px;}
  .slot{border-radius:var(--r-sm); margin-bottom:9px;}
  .slot.open{background:var(--s3); border:1px solid var(--line); padding:14px;}
  .slot.done,.slot.empty{display:flex; align-items:center; gap:12px; padding:12px 13px;
    border:1px solid var(--line-soft); background:var(--s2); cursor:pointer;
    transition:border-color .18s ease;}
  .slot.done{border-left:3px solid var(--sage);}
  .slot.empty{border-style:dashed; background:transparent;}
  .slot .tickmark{width:20px; height:20px; flex:none; border-radius:50%; background:var(--sage);
    position:relative;}
  .slot .tickmark::after{content:""; position:absolute; left:6.5px; top:2.5px; width:5px; height:10px;
    border:solid #0a0f09; border-width:0 2.5px 2.5px 0; transform:rotate(42deg);}
  .slot .tickmark.off{background:transparent; border:2px solid var(--line);}
  .slot .tickmark.off::after{display:none;}
  .slot .sbody{flex:1; min-width:0; display:flex; flex-direction:column;}
  .slot .sbody b{font-family:'Barlow Condensed',sans-serif; font-size:14px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--hi);}
  .slot .svals{font-size:12.5px; color:var(--sage); font-variant-numeric:tabular-nums;}
  .slot.empty .svals{color:var(--dim);}
  .slot .sedit{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--dim);}
  .tapecard{background:var(--s2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
    padding:14px; margin:14px 0 0;}
  .avgbox{margin-top:14px; border:1px solid var(--tint-line); border-radius:var(--r-md);
    padding:14px; background:var(--tint-strong);}
  .avgbox .slabel{margin-bottom:4px; color:var(--sage);}
  .avgvals{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px;
    letter-spacing:.02em; color:var(--hi); font-variant-numeric:tabular-nums;}

  /* ---------- trends ---------- */
  .rangebar{display:flex; gap:5px; margin:0 0 14px;}
  .rangebar button{flex:1 1 0; padding:9px 2px; border-radius:var(--r-sm); background:var(--s1);
    border:1px solid var(--line-soft); color:var(--dim);
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12.5px;
    letter-spacing:.07em; text-transform:uppercase; transition:all .18s ease;}
  .rangebar button.on{background:var(--tint-strong); border-color:var(--tint-line); color:var(--sage);}
  .secthead{display:flex; justify-content:space-between; align-items:center;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:20px 3px 10px;}
  .secthead button{background:none; border:none; padding:2px 0; color:var(--sage);
    font-family:inherit; font-weight:700; font-size:12px; letter-spacing:.11em; text-transform:uppercase;}

  .chart{border-top:1px solid var(--line-soft); padding:15px 0 6px;}
  .chart:first-of-type{border-top:none; padding-top:0;}
  .chart .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .chart .l{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim); padding-top:5px;}
  .chart .rr{display:flex; flex-direction:column; align-items:flex-end; gap:3px;}
  .chart .v{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:23px;
    color:var(--hi); letter-spacing:.02em; line-height:1; font-variant-numeric:tabular-nums;}
  .chart .v u{font-size:12px; text-decoration:none; color:var(--dim); margin-left:2px;}
  .chart .dlt{font-size:11px; font-weight:700; letter-spacing:.04em; padding:2px 8px;
    border-radius:20px; background:var(--s2); color:var(--dim); font-variant-numeric:tabular-nums;}
  .chart .dlt.good{background:var(--tint); color:var(--sage);}
  .chart .dlt.bad{background:rgba(224,177,90,.13); color:var(--amber);}
  .chart svg{width:100%; display:block; margin-top:8px;}
  .chart.hero-chart .v{font-size:34px;}
  .chart.hero-chart{padding-bottom:2px;}
  .axis{display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim);
    margin-top:3px; font-family:'Barlow Condensed',sans-serif; letter-spacing:.1em;
    text-transform:uppercase;}
  .pickrow{display:flex; align-items:center; gap:9px; margin-top:5px; padding:7px 11px;
    background:var(--tint); border:1px solid var(--tint-line); border-radius:var(--r-sm);
    font-size:11.5px; color:var(--mid); letter-spacing:.04em;}
  .pickrow b{flex:1; text-align:right; font-family:'Barlow Condensed',sans-serif; font-size:17px;
    letter-spacing:.02em; color:var(--sage); font-variant-numeric:tabular-nums;}
  .pickrow button{background:none; border:none; color:var(--dim); font-size:17px; line-height:1; padding:0 2px;}
  .chart svg .hit{cursor:pointer;}

  /* ---------- month cards ---------- */
  .mo{background:var(--s1); color:var(--hi); border:1px solid var(--line-soft);
    border-radius:var(--r-md); margin-bottom:9px; overflow:hidden;
    transition:border-color .2s ease;}
  .mo.open{border-color:var(--tint-line);}
  .mo .hd{display:flex; align-items:center; gap:11px; padding:13px 15px; cursor:pointer;}
  .mo .hd h3{font-size:16px; flex:none; color:var(--hi); letter-spacing:.04em;}
  .mo .hd .hw{margin-left:auto; font-size:12.5px; font-weight:600; color:var(--dim);
    font-variant-numeric:tabular-nums;}
  .mo .miniring{width:34px; height:34px; flex:none; position:relative;}
  .mo .miniring svg{width:34px; height:34px; transform:rotate(-90deg);}
  .mo .miniring circle{fill:none; stroke-width:3;}
  .mo .miniring .bgc{stroke:var(--track);}
  .mo .miniring .fgc{stroke:var(--sage); stroke-linecap:round;}
  .mo .miniring span{position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:11px; color:var(--sage); font-variant-numeric:tabular-nums;}
  .mo .chev{width:8px; height:8px; flex:none; border-right:2px solid var(--dim);
    border-bottom:2px solid var(--dim); transform:rotate(-45deg); margin-right:2px;
    transition:transform .25s var(--ease);}
  .mo.open .chev{transform:rotate(45deg);}
  .mo .fold{display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease);}
  .mo.open .fold{grid-template-rows:1fr;}
  .mo .fold > div{overflow:hidden; visibility:hidden; transition:visibility 0s .3s;}
  .mo.open .fold > div{visibility:visible; transition:visibility 0s 0s;}
  .mo .body{padding:2px 15px 14px;}
  .mo .kv{display:grid; grid-template-columns:repeat(2,1fr); gap:7px 12px; font-size:12.5px;}
  .mo .kv div{display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--line-soft);
    padding-top:6px;}
  .mo .kv span:first-child{color:var(--dim);}
  .mo .kv span:last-child{font-weight:600; color:var(--hi); font-variant-numeric:tabular-nums;}
  .mo .chg{margin-top:12px; padding-top:11px; border-top:1px solid var(--line-soft);}
  .mo .chg .lb{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:10.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:7px;}
  .mo .chg .items{display:flex; flex-wrap:wrap; gap:6px;}
  .mo .chg .pillv{background:var(--s2); border:1px solid var(--line-soft); border-radius:20px;
    padding:5px 11px; font-size:12px; font-weight:600; color:var(--dim);
    font-variant-numeric:tabular-nums;}
  .mo .chg .good{background:var(--tint); border-color:var(--tint-line); color:var(--sage);}
  .mo .chg .bad{background:rgba(224,177,90,.11); border-color:rgba(224,177,90,.28); color:var(--amber);}

  /* ---------- misc ---------- */
  .empty{color:var(--mid); font-size:13.5px; text-align:center; padding:30px 18px;
    border:1px dashed var(--line); border-radius:var(--r-md); margin-bottom:12px; line-height:1.65;}
  .empty svg{width:42px; height:42px; stroke:var(--sage); fill:none; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; opacity:.55; margin-bottom:12px;}
  .empty b{color:var(--hi); display:block; font-family:'Barlow Condensed',sans-serif;
    font-size:16px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
  .setrow{display:flex; gap:9px; align-items:center; padding:9px 0; border-top:1px solid var(--line-soft);}
  .setrow:first-of-type{border-top:none;}
  .setrow input[type=text]{flex:1; min-width:0; padding:10px 11px; border:1px solid var(--line);
    border-radius:var(--r-sm); font-size:15px; color:var(--hi); background:var(--field);}
  .setrow input[type=number]{width:64px; flex:none; padding:10px 6px; border:1px solid var(--line);
    border-radius:var(--r-sm); font-size:15px; text-align:center; color:var(--hi);
    background:var(--field); font-variant-numeric:tabular-nums;}
  .setrow .del{background:none; border:none; color:var(--dim); font-size:20px; padding:2px;}
  .hint{font-size:11.5px; color:var(--dim); margin-top:10px; line-height:1.55;}

  .banner{background:var(--tint-strong); border:1px solid var(--tint-line); color:var(--hi);
    border-radius:var(--r-md); padding:15px 16px; margin-bottom:12px;}
  .banner p{margin:0 0 11px; font-size:13.5px; line-height:1.5;}
  .banner b{color:var(--sage);}
  .banner.slim p{margin:0;}
  .banner.win{background:var(--s1); border-color:var(--tint-line);
    box-shadow:0 0 0 1px rgba(168,195,160,.08), 0 12px 40px rgba(168,195,160,.10);}
  .banner.win .wintop{display:flex; align-items:center; gap:13px; margin-bottom:11px;}
  .banner.win .wpc{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:40px;
    line-height:.9; color:var(--sage); font-variant-numeric:tabular-nums;}
  .banner.win .wlb{font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--dim);}
  .banner.test{background:#0d0d0d; border:1px dashed rgba(240,245,238,.28);}
  .banner.test p{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--mid);}
  .banner.test b{color:var(--sage);}
  .banner.test .btn.ghost{border-color:rgba(240,245,238,.22); color:var(--hi);}
  .btnrow{display:flex; gap:9px;}
  .btnrow .btn{margin-top:0;}
  .jumps{display:flex; gap:6px; margin-top:11px;}
  .jumps button{flex:1 1 0; padding:10px 2px; border-radius:var(--r-sm); border:1px solid var(--line-soft);
    background:var(--s2); color:var(--mid); font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;}

  /* ---------- reading row + quiet link ---------- */
  .readrow{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    background:var(--s1); border:1px solid var(--line-soft); border-radius:var(--r-md);
    padding:15px 16px; margin:14px 0 0; color:var(--hi); transition:border-color .18s ease;}
  .readrow.due{border-style:dashed; border-color:var(--tint-line);}
  .readrow.part{border-left:3px solid var(--amber);}
  .readrow.done{border-left:3px solid var(--sage);}
  .readrow .ic{width:34px; height:34px; flex:none; border-radius:50%; background:var(--s2);
    display:flex; align-items:center; justify-content:center;}
  .readrow .ic svg{width:17px; height:17px; stroke:var(--sage); fill:none; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;}
  .readrow.due .ic svg{stroke:var(--mid);}
  .readrow .rl{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .readrow .rl b{font-family:'Barlow Condensed',sans-serif; font-size:15px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--hi);}
  .readrow .rl span{font-size:12.5px; color:var(--dim);}
  .readrow .chev-r{width:8px; height:8px; flex:none; border-right:2px solid var(--dim);
    border-top:2px solid var(--dim); transform:rotate(45deg);}
  .quietlink{display:block; width:100%; margin:14px 0 4px; padding:12px; background:none;
    border:none; color:var(--dim); font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;}

  /* ---------- bottom sheet ---------- */
  body.locked{overflow:hidden;}
  .sheetbg{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:60;
    animation:fadein .22s ease;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; max-height:92vh;
    display:flex; flex-direction:column;
    background:var(--s1); border:1px solid var(--line); border-bottom:none;
    border-radius:var(--r-lg) var(--r-lg) 0 0;
    box-shadow:0 -18px 50px rgba(0,0,0,.75);
    animation:slideup .32s var(--ease);}
  .sheet .shead{position:relative; flex:none; padding:16px 18px 12px;
    border-bottom:1px solid var(--line-soft);}
  .sheet .grab{position:absolute; top:7px; left:50%; transform:translateX(-50%);
    width:38px; height:4px; border-radius:3px; background:var(--line);}
  .sheet .shead h2{font-size:17px; color:var(--hi); letter-spacing:.07em; padding-right:30px;}
  .sheet .sx{position:absolute; right:12px; top:14px; width:34px; height:34px; background:none;
    border:none; color:var(--dim); font-size:24px; line-height:1;}
  .sheet .sbodywrap{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 18px 26px;}
  .insheet .card{background:transparent; border:none; padding:0; margin:0;}
  .insheet .card h2{display:none;}
  .insheet .card .sub{margin-top:0;}
  @media (min-width:560px){
    .sheet{left:50%; transform:translateX(-50%); width:520px;
      border-radius:var(--r-lg); bottom:20px;}
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    .sheet,.sheetbg{animation:none;}
  }

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(6px);
    background:var(--s3); border:1px solid var(--tint-line); color:var(--hi);
    padding:11px 20px; border-radius:24px; font-size:13.5px; font-weight:600;
    box-shadow:0 10px 34px rgba(0,0,0,.7); opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .28s var(--ease); z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Tracker</div>
    <h1 id="title">—</h1>
  </header>
  <nav class="tabs" role="tablist">
    <span class="tabind" id="tabind"></span>
    <button role="tab" data-view="track" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tracking</button>
    <button role="tab" data-view="trends" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M3 17l5.5-6 4 3.5L21 6"/><path d="M21 6h-4.5M21 6v4.5"/></svg>Trends</button>
    <button role="tab" data-view="setup" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>Setup</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ===== the month tracking begins. change this only before you have data ===== */
var FIRST_MONTH = "2026-08";

/* ---------- storage: localStorage, memory fallback so it still runs in a preview ---------- */
var LS = (function(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }
  catch(e){ var m={}; return { getItem:function(k){return k in m?m[k]:null;},
    setItem:function(k,v){m[k]=String(v);}, removeItem:function(k){delete m[k];} }; }
})();
var KEY = "ftrk.v2";      /* namespaced: cannot collide with the training app on the same origin */
var OLDKEY = "ftrk.v1";

/* ---------- dates (local time throughout) ---------- */
function p2(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function parseISO(s){ var a=s.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
function mKeyOf(d){ return d.slice(0,7); }
function dim(key){ var a=key.split("-"); return new Date(+a[0], +a[1], 0).getDate(); }
function nextKey(key){ var a=key.split("-"), y=+a[0], m=+a[1]+1; if(m>12){m=1;y++;} return y+"-"+p2(m); }
var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function monthName(key){ return MN[+key.split("-")[1]-1]+" "+key.split("-")[0]; }
function monthShort(key){ return MS[+key.split("-")[1]-1]; }
function fmtShort(d){ return +d.slice(8)+" "+MS[+d.slice(5,7)-1]; }
function uid(){ return "a"+Math.random().toString(36).slice(2,8); }

var SIMKEY = "ftrk.sim";            /* test-mode clock, deliberately kept out of backups */
var TODAY, THISMONTH, SIM;
function refreshClock(){
  SIM = LS.getItem(SIMKEY) || null;
  if(SIM && !/^\d{4}-\d{2}-\d{2}$/.test(SIM)){ SIM=null; LS.removeItem(SIMKEY); }
  TODAY = SIM || iso(new Date());
  THISMONTH = mKeyOf(TODAY);
}
function setSim(d){
  if(d) LS.setItem(SIMKEY, d); else LS.removeItem(SIMKEY);
  refreshClock();
}
refreshClock();

/* ---------- state ---------- */
var S=null, view="track", cursor=TODAY, panel=false;

function seedActivities(){
  return [
    {id:uid(), label:"Training session", target:16},
    {id:uid(), label:"Mobility work", target:null},
    {id:uid(), label:"10,000 steps", target:null},
    {id:uid(), label:"Protein target", target:null},
    {id:uid(), label:"7+ hours sleep", target:null}
  ];
}
function blankMonth(key, acts, startISO){
  return { start: startISO || (key+"-01"), activities: JSON.parse(JSON.stringify(acts)),
           ticks:{}, draft:null, checkin:null, closed:false, closedOn:null, summary:null };
}
function fresh(){
  var acts = seedActivities();
  var start = (FIRST_MONTH > THISMONTH) ? FIRST_MONTH : THISMONTH;
  var startDate = (start === THISMONTH && TODAY > start+"-01") ? TODAY : start+"-01";
  var s = { v:2, demo:false, height:null, activities:acts, current:start, months:{} };
  s.months[start] = blankMonth(start, acts, startDate);
  return s;
}
function migrate(o){
  /* v1 kept an array of check-ins per month; v2 keeps one reading per month */
  if(!o || !o.months) return null;
  o.v = 2; if(o.height===undefined) o.height = null;
  Object.keys(o.months).forEach(function(k){
    var m=o.months[k];
    if(m.checkin===undefined){
      var arr = m.checkins || [];
      m.checkin = arr.length ? arr[arr.length-1] : null;
      if(m.checkin && m.checkin.rhr===undefined) m.checkin.rhr = null;
    }
    delete m.checkins;
    if(m.summary){ m.summary.rhr = m.summary.rhr===undefined? null : m.summary.rhr; }
  });
  return o;
}
function load(){
  var raw = LS.getItem(KEY), old;
  if(!raw && (old = LS.getItem(OLDKEY))){
    try{ S = migrate(JSON.parse(old)); }catch(e){ S=null; }
    if(S){ save(); return; }
  }
  if(!raw){ S = fresh(); save(); return; }
  try{ S = JSON.parse(raw); }catch(e){ S = fresh(); }
  if(!S || !S.months || !S.current){ S = fresh(); }
  if(S.height===undefined) S.height=null;
  if(!S.months[S.current]) S.months[S.current] = blankMonth(S.current, S.activities);
  Object.keys(S.months).forEach(function(k){ if(S.months[k].draft===undefined) S.months[k].draft=null; });
}
function save(){ LS.setItem(KEY, JSON.stringify(S)); }

/* ---------- maths ---------- */
function cur(){ return S.months[S.current]; }
function started(key){ return TODAY >= S.months[key].start; }
function elapsedDays(key){
  var m=S.months[key], startDay=+m.start.split("-")[2], last;
  if(m.closed) last = +String(m.closedOn||"").split("-")[2] || dim(key);
  else if(key < THISMONTH) last = dim(key);
  else if(key === THISMONTH) last = +TODAY.split("-")[2];
  else last = startDay-1;
  return Math.max(0, last-startDay+1);
}
function tickCount(key, actId){
  var m=S.months[key], n=0;
  for(var d in m.ticks){ if(m.ticks[d].indexOf(actId)>-1) n++; }
  return n;
}
/* days elapsed so far — used for "how far into the month am I" */
function activeDays(key){ return elapsedDays(key); }
/* every trackable day in the month — the denominator for targets and completion */
function monthDays(key){
  var m=S.months[key], startDay=+m.start.split("-")[2], last;
  if(m.closed) last = +String(m.closedOn||"").split("-")[2] || dim(key);
  else last = dim(key);
  return Math.max(0, last-startDay+1);
}
function targetFor(key, act){ return act.target ? act.target : monthDays(key); }
function rowTarget(key, act){ return act.target ? act.target : elapsedDays(key); }
function completion(key){
  var m=S.months[key];
  if(m.summary) return m.summary.rate;
  var got=0, tot=0;
  m.activities.forEach(function(a){ var t=targetFor(key,a); tot+=t; got+=Math.min(tickCount(key,a.id),t); });
  return tot? got/tot : 0;
}
function dayFraction(key, dateISO){
  var m=S.months[key], t=m.ticks[dateISO]||[], n=m.activities.length;
  return n? Math.min(t.length,n)/n : 0;
}
function whr(c){ return (c && c.waist && c.hips) ? c.waist/c.hips : null; }
function whtr(c){ return (c && c.waist && S.height) ? c.waist/S.height : null; }
function readings(){
  return Object.keys(S.months).sort().filter(function(k){ return S.months[k].checkin; })
    .map(function(k){ return {k:k, c:S.months[k].checkin}; });
}
function readingFor(key){ return S.months[key] ? S.months[key].checkin : null; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function n1(v){ return (Math.round(v*10)/10).toFixed(1); }

/* ---------- render ---------- */
var main=document.getElementById("main");

function render(){
  refreshClock();
  if(!S.months[S.current]) S.months[S.current] = blankMonth(S.current, S.activities);
  var m=cur();
  document.getElementById("eyebrow").textContent =
    started(S.current) ? "Tracking since "+fmtShort(m.start) : "Starts "+fmtShort(m.start);
  var parts = monthName(S.current).split(" ");
  document.getElementById("title").innerHTML = esc(parts[0])+' <span class="mo-yr">'+esc(parts[1])+"</span>";
  [].forEach.call(document.querySelectorAll(".tabs button"), function(b){
    b.setAttribute("aria-selected", b.dataset.view===view ? "true":"false"); });
  var html = testBanner() + rollBanner();
  if(view==="track") html += winBanner() + readingNudge() + viewTrack();
  else if(view==="trends") html += viewTrends();
  else html += viewSetup();
  html += sheet();
  main.innerHTML = html;
  if(document.getElementById("d-waist")) liveDerived();
  moveIndicator();
  runAnimations();
}
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function moveIndicator(){
  var ind=document.getElementById("tabind");
  var act=document.querySelector('.tabs button[aria-selected="true"]');
  if(!ind||!act) return;
  ind.style.width = act.offsetWidth+"px";
  ind.style.transform = "translateX("+(act.offsetLeft-4)+"px)";
}
window.addEventListener("resize", moveIndicator);
function runAnimations(){
  /* rings draw themselves in, numbers count up */
  var rings=document.querySelectorAll("[data-ring]");
  [].forEach.call(rings, function(c){
    var to=+c.getAttribute("data-ring"), C=+c.getAttribute("data-circ");
    if(REDUCED){ c.style.strokeDashoffset = C*(1-to); return; }
    c.style.strokeDashoffset = C;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      c.style.strokeDashoffset = C*(1-to);
    });});
  });
  var ups=document.querySelectorAll("[data-countup]");
  [].forEach.call(ups, function(el){
    var to=+el.getAttribute("data-countup");
    if(REDUCED || to===0){ el.textContent=to; return; }
    var t0=null, dur=850;
    function step(t){
      if(!t0) t0=t;
      var k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent = Math.round(to*e);
      if(k<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  var bars=document.querySelectorAll("[data-w]");
  [].forEach.call(bars, function(el){
    var w=el.getAttribute("data-w");
    if(REDUCED){ el.style.width=w; return; }
    el.style.width="0%";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.width=w; });});
  });
}

var justClosed=null;      /* {key, rate, days, delta} shown once after closing */
function winBanner(){
  if(!justClosed) return "";
  var w=justClosed;
  return '<div class="banner win"><div class="wintop"><span class="wpc num">'+
    Math.round(w.rate*100)+'%</span><span><span class="wlb">'+esc(monthName(w.key))+
    ' closed</span><br><b>'+w.days+' day'+(w.days===1?"":"s")+' tracked &middot; '+w.got+' of '+w.tot+
    ' ticks</b></span></div>'+
    '<p>'+esc(w.note)+'</p>'+
    '<button class="btn ghost" data-act="dismiss-win">Got it</button></div>';
}
function testBanner(){
  if(!SIM && !S.demo) return "";
  var bits=[];
  if(SIM) bits.push("Clock set to <b>"+esc(fmtLong(SIM))+"</b>");
  if(S.demo) bits.push("demo data loaded");
  return '<div class="banner test"><p>TEST MODE &mdash; '+bits.join(", ")+
    '. Nothing here is real.</p><div class="btnrow">'+
    (SIM? '<button class="btn ghost" data-act="sim-off">Back to the real date</button>':"")+
    '<button class="btn ghost" data-act="reset-clean">Reset to a clean start</button></div></div>';
}
function fmtLong(d){ var x=parseISO(d); return DS[x.getDay()]+" "+x.getDate()+" "+MS[x.getMonth()]+" "+x.getFullYear(); }

function rollBanner(){
  if(S.current >= THISMONTH || cur().closed) return "";
  return '<div class="banner"><p><b>'+esc(monthName(THISMONTH))+' has started.</b> '+
    esc(monthName(S.current))+' is still open — close it to lock in its completion rate and roll your activities forward.</p>'+
    '<button class="btn" data-act="close-month">Close '+esc(MN[+S.current.split("-")[1]-1])+' &amp; start '+
    esc(MN[+nextKey(S.current).split("-")[1]-1])+'</button></div>';
}
function readingNudge(){
  var m=cur();
  if(!started(S.current) || m.checkin) return "";
  var n = filledDays(m).length;
  var msg = n===0
    ? "<b>"+esc(monthName(S.current))+" measurements not started.</b> Three daily readings, then finalise the average."
    : (n<3 ? "<b>Day "+(n+1)+" of 3.</b> "+n+" reading"+(n===1?"":"s")+" logged so far."
           : "<b>Three readings logged.</b> Finalise them into "+esc(monthName(S.current))+"'s average.");
  return '<div class="banner"><p>'+msg+'</p><button class="btn" data-act="goto-measure">'+
    (n<3? "Log today\u2019s reading" : "Finalise the average")+'</button></div>';
}

/* ---- TRACKING (daily list + month shape) ---- */
function viewTrack(){
  return dayBlock() + monthBlock() + readingRow();
}

function readingRow(){
  var key=S.current, m=cur(), days=activeDays(key);
  if(!started(key)) return "";
  var c=m.checkin, n=filledDays(m).length, sub, state;
  if(c){ state="done"; sub="Finalised "+fmtShort(c.date)+(c.weight? "  \u00b7  "+n1(c.weight)+" kg":""); }
  else if(n){ state="part"; sub=n+" of 3 daily readings logged"; }
  else { state="due"; sub="Three-day measurement not started"; }
  var h='<button class="readrow '+state+'" data-act="open-measure">'+
    '<span class="ic">'+(state==="done"? ICON_TICK : ICON_SCALE)+'</span>'+
    '<span class="rl"><b>'+esc(monthName(key))+' reading</b><span>'+esc(sub)+'</span></span>'+
    '<span class="chev-r"></span></button>';
  if(days) h+='<button class="quietlink" data-act="close-month">Close '+esc(monthName(key))+'</button>';
  return h;
}

/* ---- day list ---- */
function dayBlock(){
  var m=cur(), key=S.current;
  var monthEnd = key+"-"+p2(dim(key));
  var minD = m.start, maxD = (TODAY < monthEnd ? TODAY : monthEnd);
  if(TODAY < minD) return '<div class="empty">'+ICON_CAL+'<b>'+esc(monthName(key))+' starts '+
    fmtShort(minD)+'</b>Nothing to tick yet. The three-day measurement opens then too.</div>';
  if(cursor < minD) cursor = minD;
  if(cursor > maxD) cursor = maxD;
  var d = parseISO(cursor), ticks = m.ticks[cursor] || [];
  var h = '<div class="daystrip">'+
    '<button data-act="day" data-d="-1" '+(cursor<=minD?"disabled":"")+' aria-label="Previous day">&#8249;</button>'+
    '<div class="dlabel"><div class="d1">'+DS[d.getDay()]+" "+d.getDate()+" "+MS[d.getMonth()]+'</div>'+
    '<div class="d2">'+(cursor===TODAY?"Today":"")+'</div></div>'+
    '<button data-act="day" data-d="1" '+(cursor>=maxD?"disabled":"")+' aria-label="Next day">&#8250;</button></div>';
  if(!m.activities.length) return h+'<div class="empty">'+ICON_LIST+
    '<b>No activities</b>Add what you want to hold yourself to in Setup.</div>';
  m.activities.forEach(function(a){
    var on = ticks.indexOf(a.id)>-1, c = tickCount(key,a.id), t = rowTarget(key,a);
    var f = t? Math.min(1, c/t) : 0, C=75.4;      /* r=12 -> 2*pi*r */
    h += '<button class="act'+(on?" on done":"")+'" data-act="tick" data-id="'+a.id+'">'+
      '<svg class="ring" viewBox="0 0 30 30" aria-hidden="true">'+
        '<circle class="bgc" cx="15" cy="15" r="12"/>'+
        '<circle class="fgc" cx="15" cy="15" r="12" stroke-dasharray="'+C+'" '+
          'stroke-dashoffset="'+(C*(1-f)).toFixed(1)+'"/>'+
        '<path class="chk" d="M10 15.4l3.1 3.1L20.2 11.4"/>'+
      '</svg>'+
      '<span class="col"><span class="name">'+esc(a.label)+'</span>'+
      '<span class="sup">'+(a.target? "monthly target" : "to date")+' &middot; '+
        Math.round(f*100)+'%</span></span>'+
      '<span class="meta num"><span class="n">'+c+'</span><span class="d">/'+t+'</span></span></button>';
  });
  h += '<div class="daytally"><b>'+ticks.length+'</b> of '+m.activities.length+' done'+
    (cursor===TODAY?" today":"")+'</div>';
  return h;
}

/* ---- month shape ---- */
function monthBlock(){
  var key=S.current, m=cur(), days=activeDays(key);
  var frac = completion(key), pct = Math.round(frac*100), C=364.4;   /* r=58 */
  var ticksDone=0, ticksTot=0;
  m.activities.forEach(function(a){ var t=targetFor(key,a); ticksTot+=t; ticksDone+=Math.min(tickCount(key,a.id),t); });
  var h = '<div class="hero"><div class="ringwrap">'+
    '<svg viewBox="0 0 132 132" aria-hidden="true">'+
      '<circle class="bgc" cx="66" cy="66" r="58"/>'+
      '<circle class="fgc" cx="66" cy="66" r="58" stroke-dasharray="'+C+'" '+
        'stroke-dashoffset="'+C+'" data-ring="'+frac.toFixed(4)+'" data-circ="'+C+'"/>'+
    '</svg>'+
    '<div class="inner"><div class="pct num"><span data-countup="'+pct+'">0</span><sup>%</sup></div>'+
    '<div class="cap">Complete</div></div></div>'+
    '<div class="side">'+
      '<div class="row"><div class="k">Day</div><div class="v num">'+
        (days? days+' <span style="color:var(--dim);font-size:14px">/ '+monthDays(key)+'</span>' : "&mdash;")+
        '</div></div>'+
      '<div class="row"><div class="k">Ticks logged</div><div class="v num">'+ticksDone+
        ' <span style="color:var(--dim);font-size:14px">/ '+ticksTot+'</span></div></div>'+
      '<div class="row"><div class="k">Reading</div><div class="v" style="font-size:15px;color:'+
        (m.checkin?"var(--sage)":"var(--dim)")+'">'+(m.checkin? "Finalised" : "Not logged")+'</div></div>'+
    '</div></div>';

  h += '<div class="card"><h2>Daily consistency</h2><div class="cal">';
  ["M","T","W","T","F","S","S"].forEach(function(x){ h+='<div class="dow">'+x+'</div>'; });
  var lead = (parseISO(key+"-01").getDay()+6)%7;
  for(var i=0;i<lead;i++) h+='<div class="pad"></div>';
  var n=dim(key), startDay=+m.start.split("-")[2];
  var maxDay = (key===THISMONTH? +TODAY.split("-")[2] : (key<THISMONTH? n : 0));
  for(var d=1; d<=n; d++){
    var dISO = key+"-"+p2(d), live = d>=startDay && d<=maxDay;
    var f = live? dayFraction(key,dISO) : 0;
    var lv = f<=0 ? "" : f<0.34 ? "l1" : f<0.67 ? "l2" : f<1 ? "l3" : "l4";
    h += '<button '+(live?'data-act="goday" data-date="'+dISO+'"':'disabled')+
      ' class="'+lv+(dISO===TODAY?" today":"")+'">'+d+'</button>';
  }
  h += '</div><div class="callegend">Less'+
    '<i style="background:var(--s2)"></i><i style="background:rgba(168,195,160,.22)"></i>'+
    '<i style="background:rgba(168,195,160,.42)"></i><i style="background:rgba(168,195,160,.68)"></i>'+
    '<i style="background:var(--sage)"></i>More</div></div>';

  return h;
}

/* ---- the measurement sheet ---- */
function sheet(){
  if(!panel) return "";
  var key=S.current;
  return '<div class="sheetbg" data-act="sheet-close"></div>'+
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(monthName(key))+' measurements">'+
      '<div class="shead"><span class="grab"></span>'+
        '<h2>'+esc(monthName(key))+' reading</h2>'+
        '<button class="sx" data-act="sheet-close" aria-label="Close">&times;</button></div>'+
      '<div class="sbodywrap insheet">'+ measureCard() +'</div></div>';
}

function ensureDraft(m){
  if(!m.draft) m.draft = { days:[null,null,null], waist:null, hips:null };
  return m.draft;
}
function filledDays(m){
  if(!m.draft) return [];
  return m.draft.days.filter(function(d){ return d && (d.weight||d.sys||d.rhr); });
}
function avgOf(days, f){
  var v=[]; days.forEach(function(d){ if(d && d[f]!==null && d[f]!==undefined && d[f]!=="") v.push(+d[f]); });
  if(!v.length) return null;
  return v.reduce(function(a,b){return a+b;},0)/v.length;
}
function draftAverage(m){
  var d=filledDays(m).slice().sort(function(a,b){ return a.date<b.date? -1 : a.date>b.date? 1 : 0; });
  if(!d.length) return null;
  var w=avgOf(d,"weight"), sy=avgOf(d,"sys"), di=avgOf(d,"dia"), r=avgOf(d,"rhr");
  return { n:d.length,
    weight: w===null?null:Math.round(w*10)/10,
    sys: sy===null?null:Math.round(sy), dia: di===null?null:Math.round(di),
    rhr: r===null?null:Math.round(r),
    first: d[0].date, last: d[d.length-1].date };
}

var slotOpen = -1;
function defaultSlot(m){
  var d=ensureDraft(m).days;
  for(var i=0;i<3;i++){ if(!d[i]) return i; }
  return -1;
}

function measureCard(){
  return cur().checkin ? finalisedCard() : intakeCard();
}

function finalisedCard(){
  var key=S.current, c=cur().checkin, src=c.from;
  var bits=[];
  if(c.weight) bits.push(kvline("Weight", n1(c.weight)+" kg"));
  if(whtr(c)) bits.push(kvline("Waist-to-height", whtr(c).toFixed(2)));
  if(whr(c)) bits.push(kvline("Waist-to-hip", whr(c).toFixed(2)));
  if(c.waist) bits.push(kvline("Waist / hips", n1(c.waist)+" / "+(c.hips? n1(c.hips):"—")+" cm"));
  if(c.sys) bits.push(kvline("Blood pressure", c.sys+"/"+c.dia));
  if(c.rhr) bits.push(kvline("Resting HR", c.rhr+" bpm"));
  return '<div class="card" id="measure"><h2>'+esc(monthShortFull(key))+' reading &middot; final</h2>'+
    '<p class="sub">'+(src&&src.n
      ? "Averaged from "+src.n+" daily reading"+(src.n===1?"":"s")+", "+fmtShort(src.first)+
        (src.last!==src.first? " to "+fmtShort(src.last):"")+". The individual readings were discarded."
      : "Logged "+fmtShort(c.date)+".")+'</p>'+
    '<div class="derived">'+bits.join("")+'</div>'+
    '<button class="btn ghost" data-act="replace-reading" style="margin-top:10px">Replace this reading</button></div>';
}
function kvline(l,v){ return '<div class="d"><span>'+l+'</span><b>'+v+'</b></div>'; }
function monthShortFull(key){ return MN[+key.split("-")[1]-1]+"\u2019s"; }

function intakeCard(){
  var key=S.current, m=cur(), dr=ensureDraft(m);
  var monthEnd=key+"-"+p2(dim(key));
  var maxDate = (TODAY<m.start ? m.start : (TODAY<monthEnd? TODAY : monthEnd));
  if(!started(key)){
    return '<div class="card" id="measure"><h2>Opening measurements</h2>'+
      '<p class="sub" style="margin-bottom:0">Three daily readings — weight, blood pressure and resting heart rate — open on '+
      fmtShort(m.start)+', then finalise into '+esc(monthName(key))+"'s average.</p></div>";
  }
  var open = (slotOpen>=0 && slotOpen<3) ? slotOpen : defaultSlot(m);
  var h = '<div class="card" id="measure"><h2>Opening measurements</h2>'+
    '<p class="sub">One reading a day for three days at the start of '+esc(monthName(key))+
    ', then finalise. Averaging three days takes the daily noise out of the trend.</p>'+
    '<div class="stepper">';
  for(var q=0;q<3;q++){
    var cls = dr.days[q] ? "done" : (q===open ? "now" : "");
    h += '<div class="st '+cls+'"><span class="dot"></span><span class="lb">Day '+(q+1)+'</span></div>';
  }
  h += '</div>';

  for(var i=0;i<3;i++){
    var d = dr.days[i];
    if(i===open){
      var def = d ? d.date : suggestDate(m,i,maxDate);
      h += '<div class="slot open"><div class="slabel">Day '+(i+1)+'</div><div class="grid2">'+
        fld("s-date","Date","date", def, ' min="'+m.start+'" max="'+maxDate+'"')+
        fld("s-weight","Weight (kg)","number", d?d.weight:null)+
        fld("s-sys","BP systolic","number", d?d.sys:null)+
        fld("s-dia","BP diastolic","number", d?d.dia:null)+
        fld("s-rhr","Resting HR (bpm)","number", d?d.rhr:null)+
        '</div><div id="bp-flag"></div>'+
        '<button class="btn" data-act="save-slot" data-i="'+i+'" style="margin-top:10px">'+
        (d? "Update day "+(i+1) : "Save day "+(i+1))+'</button></div>';
    } else if(d){
      var sum=[]; 
      if(d.weight) sum.push(n1(d.weight)+" kg");
      if(d.sys) sum.push(d.sys+"/"+d.dia);
      if(d.rhr) sum.push(d.rhr+" bpm");
      h += '<div class="slot done" data-act="open-slot" data-i="'+i+'" role="button" tabindex="0">'+
        '<span class="tickmark"></span><span class="sbody"><b>Day '+(i+1)+' &middot; '+fmtShort(d.date)+'</b>'+
        '<span class="svals">'+esc(sum.join("  \u00b7  ")||"empty")+'</span></span>'+
        '<span class="sedit">Edit</span></div>';
    } else {
      h += '<div class="slot empty" data-act="open-slot" data-i="'+i+'" role="button" tabindex="0">'+
        '<span class="tickmark off"></span><span class="sbody"><b>Day '+(i+1)+'</b>'+
        '<span class="svals">Not logged</span></span></div>';
    }
  }

  h += '<div class="tapecard"><div class="slabel">Tape &mdash; measured once</div><div class="grid2">'+
    fld("d-waist","Waist (cm)","number", dr.waist, ' data-act="edit-tape"')+
    fld("d-hips","Hips (cm)","number", dr.hips, ' data-act="edit-tape"')+
    '</div><div class="derived">'+
      '<div class="d"><span>Waist-to-height<br><span class="ref">0.50 is the usual reference</span></span><b id="whtr-live">&mdash;</b></div>'+
      '<div class="d"><span>Waist-to-hip</span><b id="whr-live">&mdash;</b></div>'+
    '</div></div>';

  var avg = draftAverage(m);
  if(avg){
    var line=[];
    if(avg.weight!==null) line.push(n1(avg.weight)+" kg");
    if(avg.sys!==null) line.push(avg.sys+"/"+avg.dia);
    if(avg.rhr!==null) line.push(avg.rhr+" bpm");
    h += '<div class="avgbox"><div class="slabel">Average of '+avg.n+' reading'+(avg.n===1?"":"s")+'</div>'+
      '<div class="avgvals">'+esc(line.join("   \u00b7   "))+'</div></div>';
  }
  h += '<button class="btn" data-act="finalise" '+(avg?"":"disabled")+' style="margin-top:10px">'+
    (avg && avg.n<3 ? "Finalise from "+avg.n+" reading"+(avg.n===1?"":"s") : "Finalise "+esc(monthName(key))+" reading")+
    '</button>'+
    '<p class="hint">Finalising stores the average as '+esc(monthName(key))+
    "'s reading and clears the daily entries.</p></div>";
  return h;
}
function suggestDate(m,i,maxDate){
  var used=[];
  m.draft.days.forEach(function(d,j){ if(d && j!==i) used.push(d.date); });
  if(TODAY>=m.start && TODAY<=maxDate && used.indexOf(TODAY)<0) return TODAY;
  var d=parseISO(m.start); d.setDate(d.getDate()+i);
  var s=iso(d);
  return s>maxDate? maxDate : s;
}
function prevOf(key){ var a=key.split("-"), y=+a[0], mm=+a[1]-1; if(mm<1){mm=12;y--;} return y+"-"+p2(mm); }
function fld(id,label,type,val,attrs){
  var extra = (type==="number" ? ' inputmode="decimal" step="0.1"' : "") + (attrs||"");
  return '<div class="fld"><label for="'+id+'">'+label+'</label>'+
    '<input id="'+id+'" type="'+type+'"'+extra+' value="'+
    (val===null||val===undefined?"":esc(val))+'"></div>';
}

/* ---- TRENDS ---- */
var ICON_CHART='<svg viewBox="0 0 24 24"><path d="M3 17l5.5-6 4 3.5L21 6"/><path d="M21 6h-4.5M21 6v4.5"/></svg>';
var ICON_CAL='<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>';
var ICON_TICK='<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
var ICON_SCALE='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8.5 10.5L12 8l3.5 2.5"/><path d="M12 8v4.5"/></svg>';
var ICON_LIST='<svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>';
var RANGES=[{k:"all",l:"All"},{k:"24",l:"24 mo"},{k:"18",l:"18 mo"},{k:"12",l:"12 mo"},{k:"6",l:"6 mo"}];
var pick=null;        /* {c:chartId, i:indexIntoRangedReadings} */
var openCards={};     /* month key -> expanded */

function rangeKey(){ return S.trendRange || "all"; }
function rangedReadings(){
  var rs=readings();
  if(!rs.length) return rs;
  var n=parseInt(rangeKey(),10);
  if(!n) return rs;
  var cut=rs[rs.length-1].k;
  for(var i=1;i<n;i++) cut=prevOf(cut);
  return rs.filter(function(r){ return r.k>=cut; });
}

function viewTrends(){
  var rs=rangedReadings(), all=readings(), h="";

  if(all.length>1){
    h += '<div class="rangebar">';
    RANGES.forEach(function(r){
      var on = rangeKey()===r.k;
      var n = parseInt(r.k,10);
      if(n && n>=monthSpan(all)+12) return;        /* hide ranges far beyond the data */
      h += '<button data-act="range" data-r="'+r.k+'" aria-pressed="'+(on?"true":"false")+'"'+
        (on?' class="on"':'')+'>'+r.l+'</button>';
    });
    h += '</div>';
  }

  if(!all.length){
    h += '<div class="empty">'+ICON_CHART+'<b>No readings yet</b>'+
      'Finalise '+esc(monthName(S.current))+"'s three-day measurement and the first point lands here.</div>";
  } else {
    h += '<div class="card"><h2>Readings</h2><p class="sub">'+
      (rs.length===1 ? "One reading in this range — a second gives you a line."
                     : rs.length+" readings, "+monthShort(rs[0].k)+" "+yr(rs[0].k)+" to "+
                       monthShort(rs[rs.length-1].k)+" "+yr(rs[rs.length-1].k)+".")+'</p>'+
      mini("wt","Weight", rs.map(function(r){return r.c.weight;}), rs, "kg", 1, true)+
      mini("whtr","Waist-to-height", rs.map(function(r){return whtr(r.c);}), rs, "", 2)+
      mini("whr","Waist-to-hip", rs.map(function(r){return whr(r.c);}), rs, "", 2)+
      mini2("bp","Blood pressure", rs.map(function(r){return r.c.sys;}), rs.map(function(r){return r.c.dia;}), rs)+
      mini("rhr","Resting HR", rs.map(function(r){return r.c.rhr;}), rs, "bpm", 0)+
      '</div>';
  }

  var closed = Object.keys(S.months).filter(function(k){ return S.months[k].closed; }).sort().reverse();
  if(!closed.length){
    h += '<div class="empty">'+ICON_CAL+'<b>No closed months</b>'+
      'Close '+esc(monthName(S.current))+' when it ends and it appears here with its completion rate.</div>';
    return h;
  }
  h += '<div class="secthead">'+closed.length+' closed month'+(closed.length===1?"":"s")+
    '<button data-act="cards-all">'+(anyOpen(closed)? "Collapse all":"Expand all")+'</button></div>';
  closed.forEach(function(k){ h += monthCard(k); });
  return h;
}
function yr(key){ return key.slice(2,4); }
function monthSpan(rs){
  if(rs.length<2) return 1;
  var a=rs[0].k.split("-"), b=rs[rs.length-1].k.split("-");
  return (+b[0]-+a[0])*12 + (+b[1]-+a[1]) + 1;
}
function anyOpen(keys){ for(var i=0;i<keys.length;i++){ if(openCards[keys[i]]) return true; } return false; }

function monthCard(k){
  var s=S.months[k].summary||{}, open=readingFor(k), close=readingFor(nextKey(k));
  var isOpen=!!openCards[k], rate=s.rate||0, C=97.4;      /* r=15.5 */
  return '<div class="mo'+(isOpen?" open":"")+'" data-mo="'+k+'">'+
    '<div class="hd" data-act="toggle-card" data-k="'+k+'" role="button" tabindex="0" aria-expanded="'+isOpen+'">'+
      '<span class="miniring"><svg viewBox="0 0 34 34" aria-hidden="true">'+
        '<circle class="bgc" cx="17" cy="17" r="15.5"/>'+
        '<circle class="fgc" cx="17" cy="17" r="15.5" stroke-dasharray="'+C+'" '+
          'stroke-dashoffset="'+(C*(1-rate)).toFixed(1)+'"/></svg>'+
        '<span class="num">'+Math.round(rate*100)+'</span></span>'+
      '<h3>'+esc(monthName(k))+'</h3>'+
      '<span class="hw num">'+(open&&open.weight? n1(open.weight)+" kg" : "")+'</span>'+
      '<span class="chev"></span></div>'+
    '<div class="fold"><div><div class="body"><div class="kv">'+
      kv("Days tracked", s.days||"—")+ kv("Ticks", (s.got||0)+" / "+(s.tot||0))+
      kv("Weight", open&&open.weight? n1(open.weight)+" kg" : "—")+
      kv("Waist-to-height", (open&&whtr(open))? whtr(open).toFixed(2) : "—")+
      kv("Waist-to-hip", (open&&whr(open))? whr(open).toFixed(2) : "—")+
      kv("BP / RHR", open&&open.sys? open.sys+"/"+open.dia+(open.rhr? "  ·  "+open.rhr : "") : "—")+
      '</div>'+ changeBlock(open, close) +'</div></div></div></div>';
}
function changeBlock(a, b){
  if(!a || !b) return "";
  var items=[];
  function add(label, x, y, dp, unit){
    if(x===null||y===null||x===undefined||y===undefined||!x||!y) return;
    var d=y-x; if(Math.abs(d)<(dp===2?0.005:0.05)) { items.push('<span class="pillv">'+label+' level</span>'); return; }
    items.push('<span class="pillv '+(d<0?"good":"bad")+'">'+label+" "+(d>0?"+":"−")+
      Math.abs(d).toFixed(dp)+(unit?" "+unit:"")+'</span>');
  }
  add("Weight", a.weight, b.weight, 1, "kg");
  add("WHtR", whtr(a), whtr(b), 2, "");
  add("WHR", whr(a), whr(b), 2, "");
  add("RHR", a.rhr, b.rhr, 0, "bpm");
  add("Systolic", a.sys, b.sys, 0, "");
  if(!items.length) return "";
  return '<div class="chg"><div class="lb">Change over the month</div><div class="items">'+items.join("")+'</div></div>';
}
function kv(a,b){ return '<div><span>'+a+'</span><span>'+b+'</span></div>'; }

/* ---- sparklines ---- */
function series(vals){
  var out=[]; vals.forEach(function(v,i){ if(v!==null&&v!==undefined&&v!=="") out.push({i:i,v:+v}); });
  return out;
}
function poly(pts, mn, mx, W, H, pad, count){
  return pts.map(function(p){
    var x = count>1 ? pad+(W-2*pad)*(p.i/(count-1)) : W/2;
    var y = pad+(H-2*pad)*(1-(p.v-mn)/(mx-mn||1));
    return {x:x, y:y, i:p.i, v:p.v};
  });
}
function dots(id, P, sel){
  var many = P.length>26;
  return P.map(function(p){
    var on = (sel===p.i);
    if(!on && many) return "";                       /* thin the dots out on long ranges */
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(on?"4.5":"2.4")+
      '" fill="'+(on?"#f0f5ee":"#a8c3a0")+'"'+(on?' stroke="#a8c3a0" stroke-width="2"':'')+'/>';
  }).join("");
}
function hits(id, P, H){
  var h=H||50, out=[];
  for(var j=0;j<P.length;j++){
    var gap = P.length>1 ? (P[P.length-1].x-P[0].x)/(P.length-1) : 60;
    var prev = j>0 ? P[j-1].x : P[j].x-gap;
    var next = j<P.length-1 ? P[j+1].x : P[j].x+gap;
    var x0=(prev+P[j].x)/2, x1=(P[j].x+next)/2;
    out.push('<rect class="hit" x="'+x0.toFixed(1)+'" y="0" width="'+(x1-x0).toFixed(1)+
      '" height="'+h+'" fill="transparent" data-act="pick" data-c="'+id+'" data-i="'+P[j].i+'"/>');
  }
  return out.join("");
}
function headRow(label, valTxt, unit, dltTxt, improving, hasDelta){
  return '<div class="top"><span class="l">'+label+'</span><span class="rr">'+
    '<span class="v num">'+valTxt+(unit? '<u>'+unit+'</u>' : '')+'</span>'+
    (hasDelta && dltTxt
      ? '<span class="dlt '+(improving?"good":"bad")+'">'+dltTxt+'</span>'
      : '<span class="dlt">no change yet</span>')+
    '</span></div>';
}
function pickRow(id, rs, txt){
  var sel = (pick && pick.c===id) ? pick.i : -1;
  if(sel<0 || !rs[sel]) return '<div class="axis"><span>'+monthShort(rs[0].k)+" "+yr(rs[0].k)+
    '</span><span>'+monthShort(rs[rs.length-1].k)+" "+yr(rs[rs.length-1].k)+'</span></div>';
  return '<div class="pickrow"><span>'+esc(monthName(rs[sel].k))+'</span><b>'+txt+'</b>'+
    '<button data-act="unpick" aria-label="Clear selection">&times;</button></div>';
}

function mini(id, label, vals, rs, unit, dp, hero){
  var pts=series(vals);
  if(!pts.length) return "";
  var last=pts[pts.length-1].v, first=pts[0].v, d=last-first;
  var dlt = pts.length>1 ? (d>0?"+":d<0?"−":"±")+Math.abs(d).toFixed(dp)+(unit?" "+unit:"") : "";
  var sel = (pick && pick.c===id) ? pick.i : -1;
  var H = hero? 96 : 50, body="", ptxt="";
  if(pts.length>1){
    var vs=pts.map(function(p){return p.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
    if(mx-mn<1e-9){ mx=mn+1; }
    var P=poly(pts,mn,mx,480,H,8,rs.length);
    var line=P.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");
    var area=line+" "+P[P.length-1].x.toFixed(1)+","+H+" "+P[0].x.toFixed(1)+","+H;
    body = '<svg viewBox="0 0 480 '+H+'" preserveAspectRatio="none" role="img" style="height:'+H+'px">'+
      '<defs><linearGradient id="g-'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#a8c3a0" stop-opacity=".26"/>'+
        '<stop offset="1" stop-color="#a8c3a0" stop-opacity="0"/></linearGradient></defs>'+
      '<polygon points="'+area+'" fill="url(#g-'+id+')"/>'+
      (sel>=0 ? vline(P, sel, H) : "")+
      '<polyline points="'+line+'" fill="none" stroke="#a8c3a0" stroke-width="2" '+
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
      dots(id,P,sel)+hits(id,P,H)+'</svg>';
  }
  if(sel>=0 && vals[sel]!==null && vals[sel]!==undefined) ptxt=(+vals[sel]).toFixed(dp)+(unit?" "+unit:"");
  else if(sel>=0) ptxt="no reading";
  return '<div class="chart'+(hero?" hero-chart":"")+'">'+
    headRow(label, last.toFixed(dp), unit, dlt, d<0, pts.length>1)+
    body+pickRow(id, rs, ptxt)+'</div>';
}
function vline(P, sel, H){
  for(var i=0;i<P.length;i++){ if(P[i].i===sel)
    return '<line x1="'+P[i].x.toFixed(1)+'" y1="4" x2="'+P[i].x.toFixed(1)+'" y2="'+(H-4)+
      '" stroke="rgba(168,195,160,.45)" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>'; }
  return "";
}
function mini2(id, label, sysV, diaV, rs){
  var ps=series(sysV), pd=series(diaV);
  if(!ps.length) return "";
  var lastS=ps[ps.length-1].v, lastD=pd.length? pd[pd.length-1].v : null;
  var dS=lastS-ps[0].v;
  var dlt = ps.length>1 ? (dS>0?"+":dS<0?"−":"±")+Math.abs(dS)+" sys" : "";
  var sel = (pick && pick.c===id) ? pick.i : -1;
  var H=50, body="", ptxt="";
  if(ps.length>1){
    var all=ps.concat(pd).map(function(p){return p.v;});
    var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
    if(mx-mn<1e-9){ mx=mn+1; }
    var A=poly(ps,mn,mx,480,H,8,rs.length), B=poly(pd,mn,mx,480,H,8,rs.length);
    var la=A.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");
    body='<svg viewBox="0 0 480 '+H+'" preserveAspectRatio="none" role="img" style="height:'+H+'px">'+
      '<defs><linearGradient id="g-'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#a8c3a0" stop-opacity=".18"/>'+
        '<stop offset="1" stop-color="#a8c3a0" stop-opacity="0"/></linearGradient></defs>'+
      '<polygon points="'+la+' '+A[A.length-1].x.toFixed(1)+','+H+' '+A[0].x.toFixed(1)+','+H+
      '" fill="url(#g-'+id+')"/>'+
      (sel>=0 ? vline(A, sel, H) : "")+
      '<polyline points="'+la+'" fill="none" stroke="#a8c3a0" stroke-width="2" vector-effect="non-scaling-stroke"/>'+
      '<polyline points="'+B.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ")+
      '" fill="none" stroke="#7d877a" stroke-width="1.8" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>'+
      dots(id,A,sel)+dots(id,B,sel)+hits(id,A,H)+'</svg>';
  }
  if(sel>=0) ptxt = (sysV[sel]? sysV[sel]+"/"+(diaV[sel]||"—") : "no reading");
  return '<div class="chart">'+headRow(label, lastS+(lastD!==null?"/"+lastD:""), "", dlt, dS<0, ps.length>1)+
    body+pickRow(id, rs, ptxt)+'</div>';
}

function openPanel(){ panel=true; slotOpen=-1; document.body.classList.add("locked"); render(); }
function closePanel(){ panel=false; document.body.classList.remove("locked"); render(); }

function toast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
document.addEventListener("click", function(ev){
  var tab = ev.target.closest(".tabs button");
  if(tab){ view = tab.dataset.view; render(); window.scrollTo(0,0); return; }
  var el = ev.target.closest("[data-act]"); if(!el) return;
  var a = el.dataset.act;

  if(a==="tick"){
    var m=cur(), t=m.ticks[cursor] || (m.ticks[cursor]=[]);
    var i=t.indexOf(el.dataset.id);
    if(i>-1) t.splice(i,1); else t.push(el.dataset.id);
    if(!t.length) delete m.ticks[cursor];
    save(); render();
  }
  else if(a==="day"){ var d=parseISO(cursor); d.setDate(d.getDate()+(+el.dataset.d)); cursor=iso(d); render(); }
  else if(a==="goday"){ cursor=el.dataset.date; view="track"; render(); window.scrollTo(0,0); }
  else if(a==="goto-measure" || a==="open-measure"){ openPanel(); }
  else if(a==="sheet-close"){ closePanel(); }
  else if(a==="open-slot"){ slotOpen=+el.dataset.i; render();
    var t=document.getElementById("measure"); if(t) t.scrollIntoView({block:"start"}); }
  else if(a==="save-slot"){ saveSlot(+el.dataset.i); }
  else if(a==="finalise"){ finaliseReading(); }
  else if(a==="replace-reading"){
    if(!confirm("Replace "+monthName(S.current)+"'s finalised reading? You'll re-enter the daily measurements from scratch.")) return;
    var old=cur().checkin;
    cur().checkin=null;
    cur().draft={ days:[null,null,null], waist:old?old.waist:null, hips:old?old.hips:null };
    slotOpen=0; save(); render();
  }
  else if(a==="close-month"){ closeMonth(); }
  else if(a==="add-act"){
    S.activities.push({id:uid(), label:"New activity", target:null}); syncMonthActs(); save(); render();
  }
  else if(a==="del-act"){
    var idx=+el.dataset.i;
    if(!confirm("Remove \u201c"+S.activities[idx].label+"\u201d? Ticks already logged against it this month are dropped from the rate.")) return;
    S.activities.splice(idx,1); syncMonthActs(); save(); render();
  }
  else if(a==="range"){
    S.trendRange = el.dataset.r; pick=null; save(); render(); window.scrollTo(0,0);
  }
  else if(a==="pick"){
    var ci=el.dataset.c, ii=+el.dataset.i;
    pick = (pick && pick.c===ci && pick.i===ii) ? null : {c:ci, i:ii};
    render();
  }
  else if(a==="unpick"){ pick=null; render(); }
  else if(a==="dismiss-win"){ justClosed=null; render(); }
  else if(a==="toggle-card"){
    var ck=el.dataset.k, node=el.closest(".mo");
    if(openCards[ck]){ delete openCards[ck]; node.classList.remove("open"); }
    else { openCards[ck]=true; node.classList.add("open"); }
    el.setAttribute("aria-expanded", openCards[ck]? "true":"false");
  }
  else if(a==="cards-all"){
    var ks=Object.keys(S.months).filter(function(x){ return S.months[x].closed; });
    if(anyOpen(ks)) openCards={}; else ks.forEach(function(x){ openCards[x]=true; });
    render();
  }
  else if(a==="sim-jump"){
    var v=el.dataset.d, d=parseISO(TODAY);
    if(v==="month") d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+(+v));
    setSim(iso(d)); cursor=TODAY; render(); toast("Clock: "+fmtLong(TODAY));
  }
  else if(a==="sim-off"){ setSim(null); cursor=TODAY; render(); toast("Back to the real date"); }
  else if(a==="demo-load"){
    if(!confirm("Replace everything with demo data? Anything you have logged is erased.")) return;
    loadDemo(); view="trends"; render(); window.scrollTo(0,0); toast("Demo data loaded");
  }
  else if(a==="reset-clean"){
    if(!confirm("Reset to an empty August 2026 and clear the test clock?")) return;
    setSim(null); LS.removeItem(KEY); LS.removeItem(OLDKEY);
    S=fresh(); save(); view="track"; cursor=TODAY; render(); window.scrollTo(0,0);
    toast("Clean start");
  }
  else if(a==="export"){ doExport(); }
  else if(a==="import"){ document.getElementById("importfile").click(); }
  else if(a==="wipe"){
    if(!confirm("Erase every month, tick and reading? This can't be undone.")) return;
    if(!confirm("Really erase everything?")) return;
    LS.removeItem(KEY); LS.removeItem(OLDKEY); load(); view="track"; cursor=TODAY; render(); toast("Cleared");
  }
});

function syncMonthActs(){ cur().activities = JSON.parse(JSON.stringify(S.activities)); }
function num(id){ var v=parseFloat((document.getElementById(id)||{}).value); return isNaN(v)?null:v; }
function liveDerived(){
  var w=num("d-waist"), hp=num("d-hips");
  var a=document.getElementById("whtr-live"), b=document.getElementById("whr-live");
  if(a) a.textContent = (w&&S.height)? (w/S.height).toFixed(2) : (w? "set height" : "—");
  if(b) b.textContent = (w&&hp)? (w/hp).toFixed(2) : "—";
  var s=num("s-sys"), d=num("s-dia"), f=document.getElementById("bp-flag");
  if(f) f.innerHTML = (s>=180 || d>=120)
    ? '<div class="flag">That reading is very high. If it repeats on a second measurement it\u2019s worth getting seen rather than logged.</div>' : "";
}
var RANGE = { weight:[25,300,"kg","Weight"], sys:[60,260,"","Systolic"], dia:[35,180,"","Diastolic"],
              rhr:[25,160,"bpm","Resting HR"], waist:[40,220,"cm","Waist"], hips:[40,220,"cm","Hips"] };
function sane(field, v){
  if(v===null) return true;
  var r=RANGE[field];
  if(v<r[0] || v>r[1]){ toast(r[3]+" of "+v+" looks like a typo"); return false; }
  return true;
}
function saveSlot(i){
  var m=cur(), dr=ensureDraft(m);
  var date=(document.getElementById("s-date")||{}).value || m.start;
  if(mKeyOf(date)!==S.current){ toast("Date must be inside "+monthName(S.current)); return; }
  var d={ date:date, weight:num("s-weight"), sys:num("s-sys"), dia:num("s-dia"), rhr:num("s-rhr") };
  if(!sane("weight",d.weight)||!sane("sys",d.sys)||!sane("dia",d.dia)||!sane("rhr",d.rhr)) return;
  if(d.weight===null && d.sys===null && d.rhr===null){ toast("Nothing to save for day "+(i+1)); return; }
  if(d.sys!==null && d.dia===null){ toast("Diastolic missing"); return; }
  dr.days[i]=d;
  slotOpen = defaultSlot(m);
  save(); render();
  toast("Day "+(i+1)+" saved");
  var t=document.getElementById("measure"); if(t) t.scrollIntoView({block:"start"});
}
function saveTape(){
  var m=cur(), dr=ensureDraft(m);
  var w=num("d-waist"), hp=num("d-hips");
  if(!sane("waist",w)||!sane("hips",hp)) return false;
  dr.waist=w; dr.hips=hp; save(); return true;
}
function finaliseReading(){
  var m=cur(), key=S.current;
  saveTape();
  var avg=draftAverage(m);
  if(!avg){ toast("No daily readings to average yet"); return; }
  var dr=m.draft;
  var msg = "Finalise "+monthName(key)+" from "+avg.n+" reading"+(avg.n===1?"":"s")+"?";
  if(avg.n<3) msg += " You planned three — the average will be less settled.";
  msg += " The daily entries are replaced by the average and can't be recovered.";
  if(!dr.waist) msg += "\n\nNo waist measurement, so neither ratio will be calculated.";
  if(!confirm(msg)) return;
  m.checkin = { date: avg.first, weight: avg.weight, waist: dr.waist, hips: dr.hips,
                sys: avg.sys, dia: avg.dia, rhr: avg.rhr,
                from: { n: avg.n, first: avg.first, last: avg.last } };
  m.draft = null; slotOpen=-1; panel=false; document.body.classList.remove("locked");
  save(); render();
  toast(monthName(key)+" reading finalised");
}
function closeMonth(){
  var key=S.current, m=cur();
  if(!confirm("Close "+monthName(key)+" at "+Math.round(completion(key)*100)+"%? You won't be able to tick days in it afterwards.")) return;
  var got=0, tot=0;
  m.activities.forEach(function(a){ var t=targetFor(key,a); tot+=t; got+=Math.min(tickCount(key,a.id),t); });
  m.closed=true;
  m.closedOn = (key>=THISMONTH? (TODAY>m.start?TODAY:m.start) : key+"-"+p2(dim(key)));
  m.summary = { rate: tot? got/tot : 0, got:got, tot:tot, days:activeDays(key) };
  var nk = nextKey(key);
  if(!S.months[nk]) S.months[nk] = blankMonth(nk, S.activities, (nk===THISMONTH && TODAY>nk+"-01")? TODAY : nk+"-01");
  S.current = nk;
  cursor = (nk===THISMONTH? TODAY : nk+"-01");
  var best=bestMonth(key);
  justClosed={ key:key, rate:m.summary.rate, days:m.summary.days, got:got, tot:tot,
    note: best ? "Your best month yet." :
      "Log "+monthName(nk)+"'s three-day reading to close off the change." };
  view="track"; panel=false; document.body.classList.remove("locked");
  save(); render(); window.scrollTo(0,0);
  toast(monthName(key)+" closed at "+Math.round(m.summary.rate*100)+"%");
}
/* ---- demo data: a plausible 18-month arc, two slumps included ---- */
var DEMO_MONTHS = 18;
var DEMO_WEIGHT = [121.5,119.8,118.0,116.5,115.2,114.0,113.4,113.8,114.1,113.0,
                   111.4,110.0,108.8,107.6,106.9,107.3,107.6,106.2];
var DEMO_RATE   = [0.82,0.86,0.79,0.88,0.84,0.70,0.52,0.44,0.76,0.85,
                   0.88,0.86,0.82,0.80,0.62,0.55,0.84,0.87];
function lcg(seed){ return function(){ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; }; }

function clearPick(){ pick=null; }
function loadDemo(){
  clearPick(); openCards={};
  var acts=[{id:"d1",label:"Training session",target:16},{id:"d2",label:"Mobility work",target:null},
            {id:"d3",label:"10,000 steps",target:null},{id:"d4",label:"Protein target",target:null},
            {id:"d5",label:"7+ hours sleep",target:null}];
  var base = THISMONTH, keys=[], k=base;
  for(var i=0;i<DEMO_MONTHS;i++){ k=prevOf(k); keys.unshift(k); }
  var st={ v:2, demo:true, height:194, activities:acts, current:base, months:{} };
  var W0 = DEMO_WEIGHT[0];

  keys.forEach(function(key, idx){
    var n=dim(key), w=DEMO_WEIGHT[idx], p=DEMO_RATE[idx], rand=lcg(idx*7919+13);
    var m=blankMonth(key, acts, key+"-01");
    for(var d=1; d<=n; d++){
      var ids=[];
      acts.forEach(function(a){
        var chance = a.target ? p*a.target/n : p;      /* keep monthly-target items near their target */
        if(rand() < chance) ids.push(a.id);
      });
      if(ids.length) m.ticks[key+"-"+p2(d)]=ids;
    }
    m.checkin = demoReading(key, w, W0);
    var got=0, tot=0;
    acts.forEach(function(a){
      var c=0; for(var dd in m.ticks){ if(m.ticks[dd].indexOf(a.id)>-1) c++; }
      var t=a.target||n; got+=Math.min(c,t); tot+=t;
    });
    m.closed=true; m.closedOn=key+"-"+p2(n);
    m.summary={ rate: tot? got/tot : 0, got:got, tot:tot, days:n };
    st.months[key]=m;
  });

  /* the live month: ticks up to today, two of three daily readings still in the drawer */
  var cm=blankMonth(base, acts, base+"-01"), today=+TODAY.split("-")[2], rand2=lcg(4242);
  for(var d2=1; d2<today; d2++){
    var ids2=[];
    acts.forEach(function(a){
      var chance = a.target ? 0.86*a.target/dim(base) : 0.86;
      if(rand2() < chance) ids2.push(a.id);
    });
    if(ids2.length) cm.ticks[base+"-"+p2(d2)]=ids2;
  }
  var wNow = DEMO_WEIGHT[DEMO_MONTHS-1]-0.9, r=demoReading(base, wNow, W0);
  cm.draft={ days:[
      {date: base+"-01", weight: Math.round((wNow-0.4)*10)/10, sys:r.sys, dia:r.dia, rhr:r.rhr},
      (today>1? {date: base+"-02", weight: Math.round((wNow+0.5)*10)/10, sys:r.sys+3, dia:r.dia+1, rhr:r.rhr+2} : null),
      null], waist:r.waist, hips:r.hips };
  st.months[base]=cm;
  S=st; slotOpen=-1; cursor=TODAY; save();
}
function demoReading(key, w, W0){
  var lost = W0 - w;
  return { date:key+"-01",
    weight: Math.round(w*10)/10,
    waist: Math.round((118 - lost*0.85)*10)/10,
    hips: Math.round((119 - lost*0.45)*10)/10,
    sys: Math.round(138 - lost*0.9),
    dia: Math.round(90 - lost*0.62),
    rhr: Math.round(68 - lost*0.75),
    from: { n:3, first:key+"-01", last:key+"-03" } };
}

function bestMonth(key){
  var r=S.months[key].summary.rate, best=true;
  Object.keys(S.months).forEach(function(k){
    if(k!==key && S.months[k].summary && S.months[k].summary.rate > r) best=false;
  });
  return best && Object.keys(S.months).filter(function(k){return S.months[k].summary;}).length>1;
}
function doExport(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  var u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download="tracker-backup-"+TODAY+".json"; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(u);},1500);
  toast("Backup downloaded");
}
function doImport(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d.months || !d.current) throw new Error("bad");
      if(!confirm("Replace everything currently in the app with this backup?")) return;
      S = (d.v===2? d : migrate(d));
      if(!S.months[S.current]) S.months[S.current]=blankMonth(S.current,S.activities);
      save(); view="track"; cursor=TODAY; render(); toast("Backup restored");
    }catch(e){ toast("That file isn't a tracker backup"); }
  };
  r.readAsText(file);
}

load();
if(cursor < cur().start) cursor = cur().start;
render();
})();
</script>
